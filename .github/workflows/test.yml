name: Enterprise Deployment Pipeline

on:
  push:
    branches:
      - release/development
      - release/production
  workflow_dispatch:

# ✅ ให้สิทธิ์ GitHub Actions อ่านโค้ดและบันทึกผล Code Scanning
permissions:
  contents: read
  security-events: write

jobs:
  # 🏗️ Job 1: Build .NET Core Application
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🏗 Build and Publish
        run: dotnet publish -c Release -o out

      - name: 📁 Archive Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: out/

  # 🔍 Job 2: Code Scanning (Security Scan / Static Analysis)
  code-scanning:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: 🛠 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔨 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🏗 Build Project (จำเป็นสำหรับ CodeQL)
        run: dotnet build --configuration Release

      - name: 🕵️ Run Security Scan (CodeQL)
        uses: github/codeql-action/init@v2
        with:
          languages: csharp

      - name: 🚀 Perform Code Scanning
        uses: github/codeql-action/analyze@v2

  # 🐳 Job 3: Build Docker Image
  build-docker-image:
    runs-on: ubuntu-latest
    needs: code-scanning
    steps:
      - name: 🛠 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔄 Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🏗 Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .

      - name: 📦 Push Docker Image
        run: docker tag myapp:${{ github.sha }} mydockerhub/myapp:${{ github.sha }} && docker push mydockerhub/myapp:${{ github.sha }}

  # 🚀 Job 4: Deploy to Development Server
  deploy-development-server:
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/release/development'
    steps:
      - name: 🚀 Deploying to Development Server (Simulation)
        run: echo "Deploying Docker Image to Development Server..."

  # 🚀 Job 5: Deploy to Production Server
  deploy-production-server:
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/release/production'
    steps:
      - name: 🚀 Deploying to Production Server (Simulation)
        run: echo "Deploying Docker Image to Production Server..."
